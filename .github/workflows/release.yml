name: Release

# PATTERN: tag-triggered releases.
# Pushing a tag like v1.2.0 runs this workflow; pushing a normal commit
# does not. That separation is the whole point: main stays green on
# every commit, and a release is a deliberate act (a tag), not an
# accident. You can also run it by hand from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/ActionsDemo.Api -c Release -o publish

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: actions-demo-api-${{ github.ref_name }}
          path: publish

      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes "Published from ${{ github.sha }}. See the README for what's in this repo." \
            publish/*
